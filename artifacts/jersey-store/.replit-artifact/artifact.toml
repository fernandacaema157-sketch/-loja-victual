kind = "web"
previewPath = "/"
title = "Jersey Store"
version = "1.0.0"
id = "artifacts/jersey-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23543

[services.development]
run = "pnpm --filter @workspace/jersey-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jersey-store", "run", "build" ]
publicDir = "artifacts/jersey-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23543"
BASE_PATH = "/"
