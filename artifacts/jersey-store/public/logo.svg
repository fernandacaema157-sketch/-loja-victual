<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0A0A0A" rx="20"/>
  <!-- Jersey base -->
  <path d="M60 70 L90 50 L110 50 L140 70 L150 110 L130 115 L130 160 L70 160 L70 115 L50 110 Z" fill="none" stroke="url(#neonGlow)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Lightning bolt -->
  <path d="M105 70 L85 110 L100 110 L95 140 L115 100 L100 100 Z" fill="#00FF87" filter="url(#glow)"/>
</svg>